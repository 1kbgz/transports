name: Build Status

on:
  push:
    branches:
      - main
    tags:
      - v*
    paths-ignore:
      - LICENSE
      - README.md
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - name: ubuntu-latest
            dist_path: dist
            os: ubuntu-latest
            python: "3.11"
            target: native
          - name: ubuntu-24.04-arm
            dist_path: dist
            os: ubuntu-24.04-arm
            python: "3.11"
            target: native
          - name: macos-latest
            dist_path: dist
            os: macos-latest
            python: "3.11"
            target: native
          - name: windows-latest
            dist_path: dist
            os: windows-latest
            python: "3.11"
            target: native
          - name: pyodide
            dist_path: dist/pyodide
            os: ubuntu-latest
            python: "3.14"
            target: pyodide

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions-ext/python/setup@a3f3953ef26a519ab7b6a56b94d06fa1b31ab3f3
        with:
          version: ${{ matrix.python }}

      - name: Setup Rust
        uses: actions-ext/rust/setup@3de300f3071e758a1dd8545b884288a35e5d7f81

      # unconditional: the pyodide leg needs pnpm too (in-wheel JS assets + browser tests)
      - name: Setup Node.js
        uses: actions-ext/node/setup@b0536d87c5e92c924bc8667f566f620758280825
        with:
          version: 22.x

      - name: Install dependencies
        run: make develop
        if: matrix.target == 'native'

      - name: Install Pyodide browser dependencies
        # develop-rs supplies wasm-bindgen-cli + the wasm32-unknown-unknown target: the pyodide wheel
        # build skips hatch-js, so the JS extension assets are built up front (see make test-pyodide)
        run: make develop-rs develop-js
        if: matrix.target == 'pyodide'

      - name: Lint
        run: make lint
        if: matrix.name == 'ubuntu-latest'

      - name: Checks
        run: make checks
        if: matrix.name == 'ubuntu-latest'

      - name: Build
        run: make build
        if: matrix.target == 'native'

      - name: Test
        run: make coverage
        if: matrix.target == 'native'

      # reduced scale for shared runners; the artifact is for trend inspection only —
      # no absolute-latency gates, hosted runners are too noisy for stable thresholds
      - name: Benchmark
        run: make benchmark-py
        env:
          TRANSPORTS_BENCH: "50:5"
          TRANSPORTS_BENCH_UPDATES: "20"
        if: matrix.name == 'ubuntu-latest'

      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: benchmark-results
          path: .benchmarks/pytest-benchmark.json
        if: matrix.name == 'ubuntu-latest'

      - name: Build and test Pyodide wheel
        run: make test-pyodide test-pyodide-browser test-jupyterlite
        if: matrix.target == 'pyodide'

      - name: Upload JupyterLite site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: jupyterlite-site
          path: dist/lite
        if: matrix.target == 'pyodide'

      - name: Upload test results (Python)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-results-${{ matrix.name }}
          path: '**/junit.xml'
        if: matrix.name == 'ubuntu-latest'

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3  # v2.24.0
        with:
          files: '**/junit.xml'
        if: matrix.name == 'ubuntu-latest'

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
        if: matrix.target == 'native'

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift
          df -h /
        shell: bash
        if: matrix.target == 'native' && runner.os == 'Linux'

      - name: Build distributions (Linux x86_64)
        run: |
          rm -rf dist
          make dist-rs
          make dist-py-sdist
          make dist-py-wheel
          make dist-check
        shell: bash
        env:
          CIBW_ARCHS_LINUX: native
        if: matrix.name == 'ubuntu-latest'

      - name: Build distributions (Linux ARM64)
        run: |
          rm -rf dist
          make dist-py-wheel
          make dist-check
        shell: bash
        env:
          CIBW_ARCHS_LINUX: native
        if: matrix.name == 'ubuntu-24.04-arm'

      - name: Build distributions (macOS/Windows)
        run: |
          rm -rf dist
          make dist-py-wheel
          make dist-check
        shell: bash
        env:
          CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=11.0
        if: matrix.target == 'native' && runner.os != 'Linux'

      - name: Test wheel
        uses: actions-ext/python/test-wheel@a3f3953ef26a519ab7b6a56b94d06fa1b31ab3f3
        with:
          module: transports
        if: matrix.target == 'native' && runner.os == 'Linux'

      - name: Test source distribution
        uses: actions-ext/python/test-sdist@a3f3953ef26a519ab7b6a56b94d06fa1b31ab3f3
        with:
          module: transports
        if: matrix.name == 'ubuntu-latest'

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist-${{ matrix.name }}
          path: ${{ matrix.dist_path }}
